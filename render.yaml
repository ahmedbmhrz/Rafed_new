databases:
  - name: rafed-db
    databaseName: rafed_db
    user: rafed_user
    plan: free

services:
  - type: web
    name: rafed-site
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn rafed_site.wsgi:application"
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rafed-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_SETTINGS_MODULE
        value: rafed_site.settings.production
      - key: PYTHON_VERSION
        value: 3.12.0
